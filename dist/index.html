<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>国泰基金登录流程重构｜交互原型</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage">
    <aside class="brief">
      <div class="eyebrow">GUOTAI FUND · INTERACTIVE PROTOTYPE</div>
      <h1>登录流程重构<br>高保真交互原型</h1>
      <p>按账户状态拆分登录与开户路径，演示各类用户在一键登录可用或不可用时，如何进入注册、实名开户或直接登录。</p>
      <div class="case-label">账户状态与登录可用性</div>
      <div class="scenario-list case-list" id="scenarioList">
        <button data-go="login" data-case="unregisteredOneTap" class="active"><span>A1</span><b>未注册新用户 · 可一键登录</b><small>本机号码验证 → 自动注册并登录</small></button>
        <button data-go="rememberedLogin" data-case="unregisteredSms"><span>A2</span><b>未注册新用户 · 不可一键登录</b><small>记住手机号 → 短信验证 → 自动注册</small></button>
        <button data-go="login" data-case="unopenedOneTap"><span>B1</span><b>已注册未开户 · 可一键登录</b><small>本机号码验证 → 直接登录 → 首页提示开户</small></button>
        <button data-go="rememberedLogin" data-case="unopenedSms"><span>B2</span><b>已注册未开户 · 不可一键登录</b><small>记住手机号 → 短信验证 → 首页提示开户</small></button>
        <button data-go="login" data-case="openedOneTap"><span>C1</span><b>已实名开户 · 可一键登录</b><small>本机号码验证 → 直接进入首页</small></button>
        <button data-go="rememberedLogin" data-case="openedSms"><span>C2</span><b>已实名开户 · 不可一键登录</b><small>记住手机号 → 短信验证 → 直接进入首页</small></button>
      </div>
      <details class="node-nav"><summary>查看后续关键节点</summary><div class="scenario-list">
        <button data-go="registerSuccess"><span>01</span><b>注册成功</b><small>实名认证强引导</small></button>
        <button data-go="homeGuest"><span>02</span><b>游客首页</b><small>先浏览，实名后置</small></button>
        <button data-go="assetsGuest"><span>03</span><b>游客资产页</b><small>不展示未核验资产</small></button>
        <button data-go="verify"><span>04</span><b>关联并开户</b><small>实名、绑卡、关联一体化</small></button>
        <button data-go="assetsDone"><span>05</span><b>完成状态</b><small>第三方持仓可查询</small></button>
      </div></details>
      <div class="legend"><i></i> 页面内按钮均可点击演示 <kbd>R</kbd> 重置</div>
    </aside>

    <section class="device-wrap">
      <div class="device">
        <div class="dynamic-island"></div>
        <div class="statusbar"><span>9:41</span><span>▮▮▮  Wi‑Fi  ▰</span></div>
        <div id="app" class="app"></div>
        <div class="home-indicator"></div>
      </div>
      <div class="caption"><span id="stepBadge">01</span><div><b id="stepTitle">首次登录</b><small id="stepHint">点击页面内按钮继续演示</small></div></div>
    </section>
  </main>
  <script src="./app.js"></script>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</body>
</html>
